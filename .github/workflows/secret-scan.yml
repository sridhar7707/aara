name: Secret & Sensitive-Path Scan

# Hard-blocking, unlike ci.yml's informational Sentinel brand check -- this
# guards against the exact incident class that happened 2026-07-29 (a
# proprietary architecture/business-doc directory was tracked into git and
# reached origin before being caught), plus real credential leaks. No
# staged rollout: the cost of a false positive here (fix the pattern list
# or the file) is much lower than the cost of another silent leak.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks needs history to scan the full push/PR range, not just the tip

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  forbidden-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Forbidden sensitive-path check
        run: python scripts/check_forbidden_paths.py

  notify-on-failure:
    needs: [gitleaks, forbidden-paths]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set -- skipping failure alert."
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA::7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="🔴 <b>SECRET/SENSITIVE-PATH SCAN FAILED</b> on main (<code>${SHA_SHORT}</code>) -- review immediately. ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}" >/dev/null \
            && echo "Telegram failure alert sent." \
            || echo "Telegram alert failed to send."
