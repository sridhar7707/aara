name: Deploy Trading Intelligence to HuggingFace Spaces

# Authorized by ADR-023 (docs/decisions/ADR-023-deploy-trading-wealth-intelligence-exception.md).
# Deploys applications/trading_intelligence/ to its own, separate HF Space --
# completely independent of deploy_ui.yml (dashboard/'s Space) and of
# deploy_wealth_intelligence.yml. No shared trigger, no shared job, no shared
# secret name for the Space ID.
#
# Not gated on the "CI" workflow (unlike deploy_ui.yml): ci.yml currently
# runs only sentinel_engine/tests and tests/, not
# applications/trading_intelligence/tests -- gating on CI success here would
# imply a coverage guarantee that doesn't exist yet. This workflow instead
# only triggers on changes to the exact paths it deploys.
#
# Gradio pin: 4.44.1, not the 5.9.0 used by dashboard/'s Space -- kept
# intentionally for applications/trading_intelligence/'s Decision Center UI,
# whose documented Gradio-4.44.1-specific keyboard-selection behavior has only
# been verified against that version. Gradio 4.44.1 supports Python >=3.8, so
# it runs unchanged on newer interpreters. Space python_version is 3.11, which
# matches the interpreter ci.yml uses to run the Trading Intelligence tests.
on:
  push:
    branches: [main]
    paths:
      - 'applications/trading_intelligence/**'
      - 'sentinel_engine/**'
      - 'brand/logos/**'
      - 'requirements_trading_intelligence.txt'
      - '.github/workflows/deploy_trading_intelligence.yml'
  workflow_dispatch:

jobs:
  deploy-trading-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install huggingface-hub
        run: pip install "huggingface-hub>=0.20.0"

      - name: Deploy to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID_TRADING_INTELLIGENCE }}
          # ADR-060 Section 2.1: existing GitHub repo secrets, passed through so
          # the sync block below can mirror them into the Space's own secret
          # store. ALPACA_BASE_URL is deliberately not passed (ADR-060 Section 4).
          ALPACA_KEY:    ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python - <<'PYEOF'
          import os, sys, shutil
          from pathlib import Path
          from huggingface_hub import HfApi

          token    = os.environ.get("HF_TOKEN", "")
          space_id = os.environ.get("HF_SPACE_ID", "")

          if not token or not space_id:
              print("::error::HF_TOKEN or HF_SPACE_ID_TRADING_INTELLIGENCE secret is not set.")
              print("Add HF_SPACE_ID_TRADING_INTELLIGENCE=<owner>/<space-name> in GitHub repo Settings -> Secrets.")
              sys.exit(1)

          # Stage only what applications/trading_intelligence/ actually needs
          # to boot: itself, the shared sentinel_engine/ package, and the one
          # brand asset gradio_view.py reads at import time.
          staging = Path("/tmp/hf_space_trading_intelligence")
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir()

          skip_tests_and_cache = shutil.ignore_patterns("__pycache__", "tests")

          # applications/ must exist as a real importable package at the
          # Space root -- bootstrap.py/gradio_view.py use fully-qualified
          # applications.trading_intelligence.* imports.
          (staging / "applications").mkdir()
          shutil.copy("applications/__init__.py", staging / "applications" / "__init__.py")
          shutil.copytree(
              "applications/trading_intelligence",
              staging / "applications" / "trading_intelligence",
              ignore=skip_tests_and_cache,
          )

          # ADR-028 Section 2.2: applications/platform/identity/ only (not
          # the rest of applications/platform/) so SupabaseAuthenticationProvider
          # is importable in the Space. Not wired into bootstrap.py by this
          # authorization -- ADR-028 Section 3 explicitly withholds that.
          (staging / "applications" / "platform").mkdir()
          shutil.copy(
              "applications/platform/__init__.py",
              staging / "applications" / "platform" / "__init__.py",
          )
          shutil.copytree(
              "applications/platform/identity",
              staging / "applications" / "platform" / "identity",
              ignore=skip_tests_and_cache,
          )

          # ADR-039: applications/platform/navigation/, registry/, workspaces/,
          # and entitlements/ -- required by bootstrap.py's NavigationBuilder
          # wiring (ADR-038). shell/ deliberately not staged -- nothing
          # imports it.
          shutil.copytree(
              "applications/platform/navigation",
              staging / "applications" / "platform" / "navigation",
              ignore=skip_tests_and_cache,
          )
          shutil.copytree(
              "applications/platform/registry",
              staging / "applications" / "platform" / "registry",
              ignore=skip_tests_and_cache,
          )
          shutil.copytree(
              "applications/platform/workspaces",
              staging / "applications" / "platform" / "workspaces",
              ignore=skip_tests_and_cache,
          )
          shutil.copytree(
              "applications/platform/entitlements",
              staging / "applications" / "platform" / "entitlements",
              ignore=skip_tests_and_cache,
          )

          # ADR-062: applications/platform/integrations/ -- the ADR-061
          # IntegrationHealth contract, imported at module scope by
          # bootstrap.py's adapter chain. Self-contained (stdlib +
          # intra-package only); no fifth subpackage transitively required.
          shutil.copytree(
              "applications/platform/integrations",
              staging / "applications" / "platform" / "integrations",
              ignore=skip_tests_and_cache,
          )

          # Shared Sentinel Intelligence Engine (zero external dependencies
          # of its own -- verified: no third-party imports anywhere in it).
          shutil.copytree(
              "sentinel_engine", staging / "sentinel_engine",
              ignore=skip_tests_and_cache,
          )

          # brand/logos/ -- required. gradio_view.py's
          # _load_shell_logo_data_uri() reads
          # brand/logos/sentinel_mark_favicon_v1.0.png at *module import
          # time* via a path computed relative to its own file location
          # (parents[4] from applications/trading_intelligence/ui/decision_center/
          # gradio_view.py resolves to this staging root once staged at the
          # same relative depth). Omitting this directory crashes the Space
          # on boot, before serving a single request -- the same failure
          # class ADR-017 fixed for dashboard/'s missing analytics/ import.
          shutil.copytree(
              "brand/logos", staging / "brand" / "logos",
              ignore=shutil.ignore_patterns("__pycache__"),
          )

          # applications/trading_intelligence/main.py -> app.py (Gradio
          # Spaces entry point). Its own `if __name__ == "__main__":` guard
          # calls build_application().build().launch() unchanged -- no
          # content rewrite needed.
          shutil.copy(
              "applications/trading_intelligence/main.py", staging / "app.py",
          )

          # ADR-056 Section 2.1: stage the top-level config.py verbatim so
          # `from config import ...` resolves at Space runtime instead of
          # hitting the ImportError fallback. Serves both ADR-054's Alpaca
          # paper adapters (ALPACA_KEY/ALPACA_SECRET/ALPACA_BASE_URL) and
          # ADR-055's trades.db snapshot pull (HF_DB_REPO_ID/HF_TOKEN). The
          # file is copied byte-for-byte -- not rewritten, filtered, or
          # templated -- and contains no secret values (every credential is
          # read via os.getenv). The corresponding Space secrets are a
          # separate maintainer step (ADR-056 Section 2.2).
          shutil.copy("config.py", staging / "config.py")

          # Product-scoped requirements (gradio + Pillow only -- see
          # requirements_trading_intelligence.txt's own header comment for
          # why 4.44.1, not requirements_space.txt's 5.9.0).
          shutil.copy(
              "requirements_trading_intelligence.txt", staging / "requirements.txt",
          )

          # Space metadata -- always overwrite so sdk_version stays in sync
          # with requirements.txt's gradio pin.
          readme = staging / "README.md"
          readme.write_text(
              "---\n"
              "title: AARA Trading Intelligence\n"
              "emoji: \U0001F4C8\n"
              "colorFrom: indigo\n"
              "colorTo: blue\n"
              "sdk: gradio\n"
              "sdk_version: 4.44.1\n"
              "python_version: \"3.11\"\n"
              "app_file: app.py\n"
              "pinned: false\n"
              "---\n"
          )

          api = HfApi(token=token)
          # Upload everything except README.md -- huggingface_hub's
          # upload_folder calls a YAML-validation endpoint for README.md
          # that occasionally returns an empty body, crashing with
          # JSONDecodeError (same issue deploy_ui.yml already works around).
          api.upload_folder(
              folder_path=str(staging),
              repo_id=space_id,
              repo_type="space",
              commit_message="chore: deploy Trading Intelligence from CI",
              ignore_patterns=["README.md"],
          )
          try:
              api.upload_file(
                  path_or_fileobj=str(staging / "README.md"),
                  path_in_repo="README.md",
                  repo_id=space_id,
                  repo_type="space",
                  commit_message="chore: update Space card metadata",
              )
          except Exception as e:
              print(f"::warning::README.md upload failed: {e} — Space card metadata may be stale")

          # ADR-060 Section 2.2: mirror the named GitHub repo secrets into the
          # Trading Intelligence Space's own encrypted secret store so config.py's
          # os.getenv(...) resolves them at Space runtime. GitHub stays the single
          # source of truth; add_space_secret overwrites (idempotent per deploy);
          # a missing value is a warning, not a hard failure -- that section just
          # stays on its honest-unavailable fallback. No value is printed.
          for _name in ("ALPACA_KEY", "ALPACA_SECRET", "HF_TOKEN"):
              _val = os.environ.get(_name, "")
              if _val:
                  api.add_space_secret(repo_id=space_id, key=_name, value=_val)
                  print(f"synced Space secret: {_name}")
              else:
                  print(f"::warning::{_name} not set in CI env — Space secret not synced; "
                        f"that section stays on its unavailable fallback")

          print(f"Trading Intelligence deployed -> https://huggingface.co/spaces/{space_id}")
          PYEOF
