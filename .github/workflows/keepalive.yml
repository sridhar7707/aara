name: Keep-Alive & Trade Dispatch

on:
  # Primary: cron-job.org (external, workflow_dispatch). Backup: native
  # GitHub schedule below, in case the external trigger is down for a
  # reason other than the weekend/holiday calendar it already respects.
  # See ADR-035.
  workflow_dispatch:
  schedule:
    # 15:00 UTC = 10:00 AM CDT, Mon-Fri -- after cron-job.org's documented
    # 8:15 AM CDT slot, so the dedup guard below sees a completed or
    # in-progress primary run and no-ops on a normal day.
    - cron: '0 15 * * 1-5'

jobs:
  dispatch-and-ping:
    runs-on: ubuntu-latest
    permissions:
      # write already includes read for this scope -- covers both the
      # existing dispatch POST and the new dedup guard's `gh api .../runs`
      # GET call below (ADR-035).
      actions: write
    steps:
      - name: Dispatch trade.yml (weekdays + market hours only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(date -u +%u)
          if [ "$DAY" -lt 1 ] || [ "$DAY" -gt 5 ]; then
            echo "Weekend — skipping trade dispatch."
            exit 0
          fi
          # Only dispatch when within NYSE trading hours (9:30–15:45 ET).
          # Outside this window the bot exits immediately and the workflow's
          # always() EOD summary step fires a misleading 0-trade report.
          HOUR_ET=$(TZ=America/New_York date +%-H)
          MIN_ET=$(TZ=America/New_York date +%-M)
          MINS_ET=$((HOUR_ET * 60 + MIN_ET))
          MARKET_OPEN=570    # 9:30 AM ET
          MARKET_CLOSE=945   # 3:45 PM ET
          if [ "$MINS_ET" -lt "$MARKET_OPEN" ] || [ "$MINS_ET" -ge "$MARKET_CLOSE" ]; then
            echo "Outside market hours ($(TZ=America/New_York date '+%H:%M ET')) — skipping trade dispatch."
            exit 0
          fi
          # ADR-035 same-day dedup guard: trade.yml's own concurrency group
          # (cancel-in-progress: true) would kill an already-running healthy
          # session if this step dispatches again on top of it -- so if any
          # run already exists for today (queued/in_progress/completed,
          # regardless of source), skip rather than dispatch a duplicate.
          TODAY_UTC=$(date -u +%Y-%m-%d)
          EXISTING_RUNS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/trade.yml/runs?created=>=${TODAY_UTC}&per_page=10" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "completed")] | length')
          if [ "${EXISTING_RUNS:-0}" -gt 0 ]; then
            echo "trade.yml already ran today (${EXISTING_RUNS} run(s) found) — skipping duplicate dispatch."
            exit 0
          fi
          echo "Within market hours ($(TZ=America/New_York date '+%H:%M ET')) — dispatching trade.yml"
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/trade.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "trade.yml dispatch triggered." \
            || echo "Dispatch failed — trade.yml will rely on its own cron."

      - name: Ping HuggingFace Space
        env:
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          if [ -z "$HF_REPO_ID" ]; then
            echo "HF_REPO_ID not set — skipping ping."
            exit 0
          fi
          SPACE_URL="https://huggingface.co/spaces/${HF_REPO_ID}"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$SPACE_URL")
          echo "Pinged ${SPACE_URL} — HTTP ${HTTP}"
