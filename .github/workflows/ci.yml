name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip            # speeds up downloads on venv cache-miss

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          # CPU-only torch: avoids the ~2.5 GB CUDA wheel (tests don't need a GPU)
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet
          .venv/bin/pip install -r requirements.txt --quiet

      - name: Activate venv
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      # Fast structural gate (file size, print() in bot/dashboard, missing type
      # hints, etc.) — fails only on BLOCK/ERROR-severity findings, same bar
      # enforced manually all along; this makes it automatic instead of relying
      # on remembering to run it locally before every push.
      - name: Architecture & standards review
        run: python scripts/arch_review.py

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      # A red CI on main silently blocks the dashboard deploy (deploy_ui.yml is
      # gated on CI success). Ping Telegram so a failing build is never invisible.
      - name: Notify Telegram on failure
        if: failure() && github.event_name == 'push'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping failure alert."
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA::7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="🔴 <b>CI FAILED</b> on main (<code>${SHA_SHORT}</code>) — dashboard deploy is BLOCKED until this is green. ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}" >/dev/null \
            && echo "Telegram failure alert sent." \
            || echo "Telegram alert failed to send."
