metadata:
  version: "1.0.2"
  brand_version: "1.0"
  status: frozen
  reason: >
    Design Governance v1.1, Stage 2 (v1.0.2): registered the 6 remaining
    implemented-but-untracked components (GovernanceBadge, EvidenceCard,
    ApprovalControls, ChainOfCustodyTimeline, AuditFingerprintCard,
    ModelAgreementBadge). Registry now covers 9/9 catalog components with a
    resolved identity; GovernancePanel remains lifecycle: unresolved and is
    counted separately -- see its note: field. No token, color, typography,
    or accessibility changes. See BRAND_CHANGELOG.md.
  unassigned_fields_note: >
    owner and criticality are not set on the 6 components added in v1.0.2.
    Both are organizational/priority judgments with no source document
    (catalog or implementation) to derive them from -- left unassigned
    rather than guessed, pending an explicit governance decision, same
    principle as GovernancePanel's lifecycle: unresolved.

# lifecycle values and what each requires:
#   implemented -- file: must exist on disk, specification: must exist
#   planned     -- specification: must exist, file: may be absent
#   unresolved  -- identity/existence not yet settled; file: and
#                  specification: not required, but note: explaining the
#                  open question IS required
#   deprecated  -- file: may still exist; validator warns rather than errors

components:
  DecisionCard:
    lifecycle: implemented
    file: "sentinel/frontend/components/decision_card.py"
    specification: "brand/design_system/DECISION_CARD.md"
    owner: "Investor Experience"
    domain:
      - decision_intelligence
      - governance
    criticality: high
    states:
      - PENDING
      - APPROVED
      - DEFERRED
      - DECLINED
      - ESCALATED
    required_metrics:
      - conviction_score
      - evidence_strength
      - decision_quality_score
    audit_requirements:
      - audit_fingerprint_hash
      - timestamp

  GovernancePanel:
    lifecycle: unresolved
    note: >
      No implementation and no catalog entry under this name.
      SENTINEL_COMPONENT_CATALOG.md's Component 1 is "GovernanceBadge"
      (governance_badge.py exists) -- a status badge, not a panel. Could be
      a typo for GovernanceBadge, or a distinct, never-built component.
      Do not assume either way; resolve by human decision, then either
      repoint this entry at GovernanceBadge or promote it to lifecycle:
      planned with its own specification.
    owner: "Risk & Policy Engine"
    domain:
      - risk_governance
      - audit_trails
    criticality: high
    states:
      - NORMAL
      - WARNING
      - DEFENSIVE
    required_fields:
      - governance_checks
      - policy_version
      - audit_reference

  RiskGovernorBadge:
    lifecycle: implemented
    file: "sentinel/frontend/components/risk_governor_badge.py"
    specification: "brand/design_system/RISK_GOVERNOR_BADGE.md"
    owner: "Risk & Policy Engine"
    domain:
      - defensive_state
    criticality: high
    states:
      - NORMAL
      - WARNING
      - DEFENSIVE

  PortfolioHealthCard:
    lifecycle: implemented
    canonical_name: PortfolioHealthCard
    file: "sentinel/frontend/components/health_score.py"
    aliases:
      - HealthScore
    migration_note: >
      Implementation module/docstring currently say "HealthScore"
      (sentinel/frontend/components/health_score.py); catalog and this
      registry use the canonical name "PortfolioHealthCard". Purpose and
      domain match SENTINEL_COMPONENT_CATALOG.md's Component 8. Remove the
      HealthScore alias once the implementation is renamed to match, in the
      next major version.
    specification: "brand/design_system/PORTFOLIO_HEALTH_CARD.md"
    owner: "Portfolio Analytics"
    domain:
      - asset_health
    criticality: medium
    required_metrics:
      - decision_quality_score
      - model_agreement

  GovernanceBadge:
    lifecycle: implemented
    file: "sentinel/frontend/components/governance_badge.py"
    specification: "brand/design_system/GOVERNANCE_BADGE.md"
    domain:
      - governance
    states:
      - PASS
      - ESCALATED
      - BREACH

  EvidenceCard:
    lifecycle: implemented
    file: "sentinel/frontend/components/evidence_card.py"
    specification: "brand/design_system/EVIDENCE_CARD.md"
    domain:
      - evidence_provenance
    states:
      - collapsed
      - expanded
      - inspecting
    required_fields:
      - evidence_id
      - type
      - provider
      - provider_version
      - data_as_of
      - recorded_at
      - confidence
      - confidence_interval

  ApprovalControls:
    lifecycle: implemented
    file: "sentinel/frontend/components/approval_controls.py"
    specification: "brand/design_system/APPROVAL_CONTROLS.md"
    domain:
      - decision_intelligence
      - governance
    states:
      - ready
      - submitting
      - disabled
      - escalated
    required_fields:
      - decision_id
      - can_approve
      - requires_confirmation
      - is_escalated

  ChainOfCustodyTimeline:
    lifecycle: implemented
    canonical_name: ChainOfCustodyTimeline
    file: "sentinel/frontend/components/chain_timeline.py"
    aliases:
      - ChainTimeline
    migration_note: >
      Implementation module/docstring say "ChainTimeline"
      (sentinel/frontend/components/chain_timeline.py); catalog Component 5
      "Name:" field says "ChainOfCustodyTimeline". Same alias pattern as
      PortfolioHealthCard/HealthScore. Remove the alias once the
      implementation is renamed to match, in the next major version.
    specification: "brand/design_system/CHAIN_OF_CUSTODY_TIMELINE.md"
    domain:
      - audit_trails
    states:
      - collapsed
      - expanded
      - verifying
      - verified
      - tampered

  AuditFingerprintCard:
    lifecycle: implemented
    canonical_name: AuditFingerprintCard
    file: "sentinel/frontend/components/audit_fingerprint.py"
    aliases:
      - AuditFingerprint
      - AuditFingerprintDisplay
    migration_note: >
      Three names exist for this one component: the catalog's Component 6
      in-section "Name:" field says "AuditFingerprintCard" (used here as
      canonical); the catalog's own end-of-document summary list instead
      calls it "AuditFingerprintDisplay" -- an inconsistency inside
      SENTINEL_COMPONENT_CATALOG.md itself, not introduced by this
      registry; the implementation module/docstring say "AuditFingerprint"
      (sentinel/frontend/components/audit_fingerprint.py). Both aliases
      are registered so neither name silently 404s a lookup. Resolve the
      catalog's internal inconsistency separately, then collapse to one
      name in the next major version.
    specification: "brand/design_system/AUDIT_FINGERPRINT_CARD.md"
    domain:
      - audit_trails
    states:
      - default
      - verifying
      - verified
      - tampered

  ModelAgreementBadge:
    lifecycle: implemented
    canonical_name: ModelAgreementBadge
    file: "sentinel/frontend/components/model_agreement.py"
    aliases:
      - ModelAgreement
      - ModelAgreementIndicator
    migration_note: >
      Three names exist for this one component: the catalog's Component 7
      in-section "Name:" field says "ModelAgreementBadge" (used here as
      canonical); the catalog's own section heading instead reads "Model
      Agreement Indicator" -- an inconsistency inside
      SENTINEL_COMPONENT_CATALOG.md itself, not introduced by this
      registry; the implementation module/docstring say "ModelAgreement"
      (sentinel/frontend/components/model_agreement.py). Both aliases are
      registered so neither name silently 404s a lookup. Resolve the
      catalog's internal inconsistency separately, then collapse to one
      name in the next major version.
    specification: "brand/design_system/MODEL_AGREEMENT_BADGE.md"
    domain:
      - model_intelligence
    required_metrics:
      - model_agreement
